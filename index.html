<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>festival app</title>

<!-- PWA manifest inline -->
<link rel="manifest" href='data:application/json,{
  "name":"festival app",
  "short_name":"festival",
  "start_url":".",
  "display":"standalone",
  "background_color":"#ffffff",
  "theme_color":"#ff4d4d"
}'>

<meta name="theme-color" content="#ff4d4d">

<style>
body{
  margin:0;
  background:#f4f4f4;
  font-family:Arial, sans-serif;
}
header{
  background:#ff4d4d;
  padding:12px;
  color:white;
  font-weight:bold;
  font-size:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:6px;
  background:#ff4d4d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.card{
  background:white;
  padding:16px;
  margin:16px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
.ticket{
  border-radius:16px;
  border:1px solid #ddd;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.ticket-header{
  font-size:18px;
  font-weight:bold;
}
.ticket-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.ticket-label{
  color:#777;
  font-size:14px;
}
.ticket-value{
  font-weight:bold;
  font-size:16px;
  word-break:break-all;
}
.ticket-type{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#ffe6b3;
  color:#b36b00;
  font-weight:bold;
  font-size:13px;
}
.ticket-status{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}
.ticket-status.ok{
  background:#e6ffe9;
  color:#1f8a3b;
}
.ticket-status.bad{
  background:#ffe6e6;
  color:#b30000;
}
.hidden{display:none!important}
</style>
</head>

<body>

<header>
  <span>festival app</span>
  <button id="installBtn" class="hidden">App installeren</button>
</header>

<!-- Ticket UI -->
<div class="card">
  <h2>Jouw ticket</h2>
  <div class="ticket">
    <div class="ticket-header">Ticket</div>

    <div class="ticket-row">
      <div>
        <div class="ticket-label">Code</div>
        <div class="ticket-value" id="ticketCode">Nog niet gescand</div>
      </div>
      <div>
        <div class="ticket-label">Type</div>
        <span class="ticket-type" id="ticketType">VIP</span>
      </div>
    </div>

    <div class="ticket-row" style="margin-top:10px;">
      <div class="ticket-label">Status</div>
      <div id="ticketStatus" class="ticket-status bad">
        Geen scan uitgevoerd
      </div>
    </div>
  </div>
</div>

<!-- TYPE SCAN -->
<div class="card">
  <h2>Type scan</h2>
  <p>Typ een ticketcode en druk op SCAN.</p>

  <input id="typedInput" placeholder="Typ code hier..." style="width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc;">
  <button style="margin-top:12px;width:100%;" id="typedScanBtn">SCAN</button>

  <div id="typedResult" style="margin-top:10px;font-weight:bold;"></div>
</div>

<script>
// Alleen type-scan, geen camera
const GELDIGE_TICKET_CODE = "Q-T9kuhRZ";

function updateStatus(code){
  const statusEl = document.getElementById("ticketStatus");
  const codeEl = document.getElementById("ticketCode");

  codeEl.textContent = code;

  if(code === GELDIGE_TICKET_CODE){
    statusEl.textContent = "Geldig ticket";
    statusEl.classList.remove("bad");
    statusEl.classList.add("ok");
  } else {
    statusEl.textContent = "Ongeldig ticket";
    statusEl.classList.remove("ok");
    statusEl.classList.add("bad");
  }
}

document.getElementById("typedScanBtn").onclick = ()=>{
  const val = document.getElementById("typedInput").value.trim();
  if(val === ""){
    document.getElementById("typedResult").textContent = "Geen code ingevoerd";
    return;
  }
  document.getElementById("typedResult").textContent = "Gescand: " + val;
  updateStatus(val);
};

/* PWA service worker inline */
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE_NAME = 'festival-app-v1';
    const ASSETS = ['.','index.html'];

    self.addEventListener('install', (event)=>{
      event.waitUntil(
        caches.open(CACHE_NAME).then(cache=>cache.addAll(ASSETS))
      );
    });

    self.addEventListener('activate', (event)=>{
      event.waitUntil(
        caches.keys().then(keys =>
          Promise.all(
            keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
          )
        )
      );
    });

    self.addEventListener('fetch', (event)=>{
      event.respondWith(
        caches.match(event.request).then(resp => resp || fetch(event.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl);
}

/* Install prompt */
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.remove('hidden');
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add('hidden');
});
</script>

</body>
</html>
