<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>festival app</title>

<!-- PWA manifest inline -->
<link rel="manifest" href='data:application/json,{
  "name":"festival app",
  "short_name":"festival",
  "start_url":".",
  "display":"standalone",
  "background_color":"#ffffff",
  "theme_color":"#ff4d4d"
}'>

<meta name="theme-color" content="#ff4d4d">

<style>
body{
  margin:0;
  background:#f4f4f4;
  font-family:Arial, sans-serif;
}

/* HEADER */
header{
  background:#ff4d4d;
  padding:12px;
  color:white;
  font-weight:bold;
  font-size:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* MENU BAR */
#menu{
  display:flex;
  overflow-x:auto;
  background:#fff;
  border-bottom:1px solid #ddd;
}
#menu button{
  flex:1;
  padding:12px;
  border:none;
  background:white;
  font-weight:bold;
  cursor:pointer;
  border-right:1px solid #eee;
}
#menu button.active{
  background:#ff4d4d;
  color:white;
}

/* CARDS */
.card{
  background:white;
  padding:16px;
  margin:16px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

/* TICKET UI */
.ticket{
  border-radius:16px;
  border:1px solid #ddd;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.ticket-header{
  font-size:18px;
  font-weight:bold;
}
.ticket-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.ticket-label{
  color:#777;
  font-size:14px;
}
.ticket-value{
  font-weight:bold;
  font-size:16px;
  word-break:break-all;
}
.ticket-type{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#ffe6b3;
  color:#b36b00;
  font-weight:bold;
  font-size:13px;
}
.ticket-status{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}
.ticket-status.ok{
  background:#e6ffe9;
  color:#1f8a3b;
}
.ticket-status.bad{
  background:#ffe6e6;
  color:#b30000;
}

.hidden{display:none!important}
</style>
</head>

<body>

<header>
  <span>festival app</span>
  <button id="installBtn" class="hidden">App installeren</button>
</header>

<!-- MENU -->
<div id="menu">
  <button class="active" data-page="scanner">Scanner</button>
  <button data-page="admin">Admin</button>
  <button data-page="crew">Crew</button>
  <button data-page="bar">Bar</button>
  <button data-page="viewer">Viewer</button>
</div>

<!-- PAGINA'S -->
<div id="pages">

  <!-- SCANNER PAGE -->
  <div id="scanner" class="page">

    <div class="card">
      <h2>Jouw ticket</h2>
      <div class="ticket">
        <div class="ticket-header">Ticket</div>

        <div class="ticket-row">
          <div>
            <div class="ticket-label">Code</div>
            <div class="ticket-value" id="ticketCode">Nog niet gescand</div>
          </div>
          <div>
            <div class="ticket-label">Type</div>
            <span class="ticket-type" id="ticketType">VIP</span>
          </div>
        </div>

        <div class="ticket-row" style="margin-top:10px;">
          <div class="ticket-label">Status</div>
          <div id="ticketStatus" class="ticket-status bad">
            Geen scan uitgevoerd
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Type scan</h2>
      <p>Typ een ticketcode en druk op SCAN.</p>

      <input id="typedInput" placeholder="Typ code hier..." style="width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc;">
      <button style="margin-top:12px;width:100%;" id="typedScanBtn">SCAN</button>

      <div id="typedResult" style="margin-top:10px;font-weight:bold;"></div>
    </div>

  </div>

  <!-- ADMIN PAGE -->
  <div id="admin" class="page hidden">
    <div class="card">
      <h2>Admin</h2>
      <p>Admin functies komen hier.</p>
    </div>
  </div>

  <!-- CREW PAGE -->
  <div id="crew" class="page hidden">
    <div class="card">
      <h2>Crew</h2>
      <p>Crew tools komen hier.</p>
    </div>
  </div>

  <!-- BAR PAGE -->
  <div id="bar" class="page hidden">
    <div class="card">
      <h2>Bar</h2>
      <p>Bar functies komen hier.</p>
    </div>
  </div>

  <!-- VIEWER PAGE -->
  <div id="viewer" class="page hidden">
    <div class="card">
      <h2>Viewer</h2>
      <p>Viewer scherm komt hier.</p>
    </div>
  </div>

</div>

<script>
// MENU NAVIGATIE
document.querySelectorAll("#menu button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    const page = btn.dataset.page;
    document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
    document.getElementById(page).classList.remove("hidden");
  };
});

// TYPE SCAN LOGICA
const GELDIGE_TICKET_CODE = "Q-T9kuhRZ";

function updateStatus(code){
  const statusEl = document.getElementById("ticketStatus");
  const codeEl = document.getElementById("ticketCode");

  codeEl.textContent = code;

  if(code === GELDIGE_TICKET_CODE){
    statusEl.textContent = "Geldig ticket";
    statusEl.classList.remove("bad");
    statusEl.classList.add("ok");
  } else {
    statusEl.textContent = "Ongeldig ticket";
    statusEl.classList.remove("ok");
    statusEl.classList.add("bad");
  }
}

document.getElementById("typedScanBtn").onclick = ()=>{
  const val = document.getElementById("typedInput").value.trim();
  if(val === ""){
    document.getElementById("typedResult").textContent = "Geen code ingevoerd";
    return;
  }
  document.getElementById("typedResult").textContent = "Gescand: " + val;
  updateStatus(val);
};

/* PWA service worker inline */
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE_NAME = 'festival-app-v1';
    const ASSETS = ['.','index.html'];

    self.addEventListener('install', (event)=>{
      event.waitUntil(
        caches.open(CACHE_NAME).then(cache=>cache.addAll(ASSETS))
      );
    });

    self.addEventListener('activate', (event)=>{
      event.waitUntil(
        caches.keys().then(keys =>
          Promise.all(
            keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
          )
        )
      );
    });

    self.addEventListener('fetch', (event)=>{
      event.respondWith(
        caches.match(event.request).then(resp => resp || fetch(event.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl);
}

/* Install prompt */
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.remove('hidden');
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add('hidden');
});
</script>

</body>
</html>
